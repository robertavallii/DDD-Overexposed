<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    #cesiumContainer { width: 100%; height: 100vh; margin: 0; padding: 0; overflow: hidden; }
    body { margin: 0; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    // Inserisci qui la tua API Key di Google Cloud
    const googleApiKey = "AIzaSyCq5kDXZ1R6txl8a0SkE6D8u0vYlWL_eTM";

    // Inizializza il visualizzatore Cesium
    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrainProvider: null, // Useremo le 3D Tiles di Google per il terreno
      baseLayerPicker: false,
      sceneModePicker: false,
      animation: false,
      timeline: false
    });

    async function addGoogleTiles() {
      try {
        // Carica le Photorealistic 3D Tiles di Google
        const tileset = await Cesium.createGooglePhotorealistic3DTileset(googleApiKey);
        viewer.scene.primitives.add(tileset);
        
        // Imposta la vista iniziale (es: Roma)
        viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(12.4922, 41.8902, 1000),
          orientation: {
            heading: Cesium.Math.toRadians(0),
            pitch: Cesium.Math.toRadians(-35),
            roll: 0
          }
        });
      } catch (error) {
        console.error("Errore nel caricamento delle Tiles:", error);
      }
    }

    addGoogleTiles();
  </script>
</body>
</html>
